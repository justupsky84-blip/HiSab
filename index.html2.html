<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1b3a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>HisabBook</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--tx:#0b1b3a;--mut:#6b7488;--bd:#e4e8f0;--navy:#0b1b3a;--inc:#10b981;--exp:#ef4444;--biz:#6366f1;--warn:#f59e0b}
[data-theme=dark]{--bg:#0a1226;--card:#111d3a;--tx:#e9edf7;--mut:#93a0bb;--bd:#1f2d52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px}
main{max-width:680px;margin:0 auto;padding:12px 14px 96px}
header.hdr{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:10px 14px 10px;padding-top:max(10px,env(safe-area-inset-top))}
.hin{max-width:680px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.top b{font-size:18px}
.top button{background:none;border:none;color:#fff;font-size:19px;padding:4px 8px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:rgba(255,255,255,.12);border-radius:12px;padding:3px;gap:3px}
.seg button{background:none;border:none;color:#cbd5ee;padding:7px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}
.seg button.on{background:#fff;color:var(--navy);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:6px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:999px;padding:6px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme=dark] .chip.on{background:#2b4a9a;border-color:#2b4a9a}
.hdr .chip{background:rgba(255,255,255,.12);border-color:transparent;color:#dbe4ff}
.hdr .chip.on{background:#fff;color:var(--navy)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px}
.hero{background:linear-gradient(135deg,#0b1b3a,#1e3a8a);color:#fff;border:none}
.hero small{color:#b8c6ea}
.hero .big{font-size:30px;font-weight:800;margin:2px 0 10px}
.hero .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.hero .two div{background:rgba(255,255,255,.1);border-radius:12px;padding:8px 10px}
.hero .two b{display:block;font-size:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.metric{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:11px 12px}
.metric small{color:var(--mut);display:block;font-size:12px}
.metric b{font-size:17px}
.inc{color:var(--inc)}.exp{color:var(--exp)}.biz{color:var(--biz)}.mut{color:var(--mut)}.warn{color:var(--warn)}
small,.small{font-size:12px;color:var(--mut)}
.qa{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:12px 0}
.qa button{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 2px;font:inherit;font-size:11px;color:var(--tx);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.qa span{font-size:20px}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.row:last-child{border-bottom:none}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-weight:600}
.row .grow small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--bg);flex:none}
.ic.inc{background:rgba(16,185,129,.14)}.ic.exp{background:rgba(239,68,68,.14)}.ic.mut{background:rgba(99,102,241,.14)}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:999px;font-weight:700}
.b-paid{background:rgba(16,185,129,.16);color:var(--inc)}
.b-part{background:rgba(245,158,11,.18);color:var(--warn)}
.b-pend{background:rgba(99,102,241,.16);color:var(--biz)}
.b-over{background:rgba(239,68,68,.16);color:var(--exp)}
.prog{height:6px;background:var(--bd);border-radius:6px;overflow:hidden;margin:8px 0}
.prog i{display:block;height:100%;background:var(--inc)}
.btn{border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;padding:10px 14px;font:inherit;font-weight:600;cursor:pointer}
.btn.pri{background:var(--navy);color:#fff;border-color:var(--navy)}
[data-theme=dark] .btn.pri{background:#2b4a9a;border-color:#2b4a9a}
.btn.dng{color:var(--exp);border-color:var(--exp)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:9px}
.btns{display:flex;gap:8px;margin-top:14px}.btns .btn{flex:1}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 0}
input,select,textarea{width:100%;font:inherit;font-size:15px;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:11px;padding:10px;margin-top:4px}
input[type=file]{padding:8px}
.fab{position:fixed;right:18px;bottom:84px;width:54px;height:54px;border-radius:18px;border:none;background:var(--inc);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer;z-index:15}
nav.nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--bd);display:grid;grid-template-columns:repeat(5,1fr);z-index:20;padding-bottom:env(safe-area-inset-bottom)}
nav.nav button{background:none;border:none;color:var(--mut);padding:8px 0 7px;font:inherit;font-size:11px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer}
nav.nav button span{font-size:20px}
nav.nav button.on{color:var(--biz);font-weight:700}
#modal{position:fixed;inset:0;background:rgba(5,10,25,.55);z-index:50;display:none;align-items:flex-end;justify-content:center}
#modal.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:680px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:16px 16px 24px}
.sh-h{display:flex;justify-content:space-between;align-items:center;font-size:17px;position:sticky;top:-16px;background:var(--card);padding:6px 0 4px;z-index:2}
.sh-h button{background:var(--bg);border:none;border-radius:50%;width:32px;height:32px;color:var(--tx);cursor:pointer}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
#toast.on{opacity:1}
#lock{position:fixed;inset:0;background:var(--navy);z-index:100;display:none;align-items:center;justify-content:center;color:#fff;padding:24px}
#lock.on{display:flex}
#lock .lk{width:100%;max-width:320px;text-align:center}
#lock input{text-align:center;font-size:26px;letter-spacing:10px;color:#fff;background:rgba(255,255,255,.1);border-color:transparent}
.empty{text-align:center;color:var(--mut);padding:26px 10px}
.empty span{font-size:34px;display:block;margin-bottom:6px}
.demo{background:var(--warn);color:#fff;text-align:center;border-radius:10px;padding:6px;font-size:12px;font-weight:700;margin-bottom:8px}
.bars{display:flex;align-items:center;gap:8px;margin:7px 0;font-size:13px}
.bars .n{width:92px;flex:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bars .t{flex:1;height:10px;background:var(--bd);border-radius:6px;overflow:hidden}
.bars .t i{display:block;height:100%;background:var(--exp)}
.bars .v{width:78px;text-align:right;flex:none}
svg .bi{fill:var(--inc)}svg .be{fill:var(--exp)}svg text{fill:var(--mut);font-size:9px;text-anchor:middle}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mut);margin-top:4px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:4px}
.rcpt{max-width:100%;border-radius:10px;margin-top:8px}
.kv{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--bd)}
.kv:last-child{border-bottom:none}
.pr-title{display:none}
@media print{header.hdr,nav.nav,.fab,.noprint,#toast{display:none!important}:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#555;--bd:#ccc}body{background:#fff}.pr-title{display:block;font-size:18px;font-weight:700;margin-bottom:8px}.card{break-inside:avoid}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="lock"></div>
<input type="file" id="rf" accept=".json,application/json" hidden>

<script>
'use strict';
/* ===================== Helpers ===================== */
const $=s=>document.querySelector(s);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const METHODS=['Cash','UPI','Card','Bank transfer','Cheque','Other'];
const ls={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v);return true}catch(e){return false}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(2,'0');
const fd8=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>fd8(new Date());
const pd=s=>new Date(s+'T00:00:00');
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return fd8(d)};
const addMonths=(s,n)=>{const d=pd(s),day=d.getDate();const x=new Date(d.getFullYear(),d.getMonth()+n,1);x.setDate(Math.min(day,new Date(x.getFullYear(),x.getMonth()+1,0).getDate()));return fd8(x)};
const dfmt=s=>{if(!s)return '';const [y,m,d]=s.split('-');return (+d)+' '+MON[m-1]+' '+y.slice(2)};
const r2=n=>Math.round((n+Number.EPSILON)*100)/100;
const num=v=>{const n=parseFloat(v);return isNaN(n)?NaN:r2(n)};
const inr=n=>(n<0?'-':'')+'₹'+Math.abs(n).toLocaleString('en-IN',{maximumFractionDigits:2});
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pick=o=>Object.fromEntries(Object.entries(o).filter(([k,v])=>v!==undefined&&v!==''));
const live=a=>a.filter(x=>!x.deleted);
const rec=o=>Object.assign({id:uid(),userId:'local',created:now(),updated:now()},o);
const byDate=(a,b)=>b.date.localeCompare(a.date)||b.created.localeCompare(a.created);
let toastT;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),2400);return false}
function download(name,text,mime){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type:mime||'text/plain'}));a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
const empty=(m,i)=>`<div class="empty"><span>${i||'📭'}</span>${m}</div>`;

/* ===================== Data layer ===================== */
const KEYS={real:'hisabbook_v1',demo:'hisabbook_demo_v1',pin:'hisabbook_pin',ui:'hisabbook_ui',auto:'hisabbook_autobackup'};
let demo=ls.get('hb_demo')==='1';
let db=null;
let ui=Object.assign({tab:'home',scope:'combined',biz:'all'},(()=>{try{return JSON.parse(ls.get(KEYS.ui)||'{}')}catch(e){return {}}})());
ui.page=null;ui.sub={};
const saveUi=()=>ls.set(KEYS.ui,JSON.stringify({tab:ui.tab,scope:ui.scope,biz:ui.biz}));
const dbKey=()=>demo?KEYS.demo:KEYS.real;

function blank(){
  const cats=[];const mk=(n,t,s)=>cats.push({id:uid(),userId:'local',name:n,type:t,scope:s,builtin:true,created:now()});
  ['Food','Travel','Shopping','Education','Bills','Healthcare','Entertainment','Other'].forEach(n=>mk(n,'expense','personal'));
  ['Salary','Business','Gift','Other'].forEach(n=>mk(n,'income','personal'));
  ['Sales','Other Income'].forEach(n=>mk(n,'income','business'));
  ['Purchase','Rent','Salary','Transport','Utilities','Marketing','Other'].forEach(n=>mk(n,'expense','business'));
  return {v:1,created:now(),accounts:[rec({name:'Cash',type:'cash',opening:0,scope:'personal',bizId:null})],businesses:[],categories:cats,contacts:[],tx:[],udhaar:[],payments:[],reminders:[],items:[],audit:[],profile:{name:''}};
}
function load(){
  try{db=JSON.parse(ls.get(dbKey()))}catch(e){db=null}
  if(!db||!Array.isArray(db.accounts)){ if(demo){seedDemo()}else{db=blank()} save(); }
  ['accounts','businesses','categories','contacts','tx','udhaar','payments','reminders','items','audit'].forEach(k=>{if(!Array.isArray(db[k]))db[k]=[]});
  db.profile=db.profile||{name:''};
}
function save(){
  const ok=ls.set(dbKey(),JSON.stringify(db));
  if(!ok)toast('Storage full! Backup lo aur receipts hata do');
  return ok;
}
function autoBackup(){
  if(demo)return;
  try{const cur=JSON.parse(ls.get(KEYS.auto)||'null');if(cur&&cur.date===today())return;
    if(db.tx.length||db.udhaar.length)ls.set(KEYS.auto,JSON.stringify({date:today(),data:db}));}catch(e){}
}
function audit(action,type,recId,before,after){
  db.audit.push({id:uid(),userId:'local',ts:now(),action,type,recId,before:before||null,after:after||null});
  if(db.audit.length>1500)db.audit.splice(0,db.audit.length-1500);
}

/* ---- lookups ---- */
const acc=id=>db.accounts.find(a=>a.id===id);
const accName=id=>(acc(id)||{name:'?'}).name;
const bizName=id=>(db.businesses.find(b=>b.id===id)||{name:''}).name;
const cname=id=>(db.contacts.find(c=>c.id===id)||{name:'?'}).name;
const bizs=()=>live(db.businesses);
const accountsFor=(scope,bizId)=>live(db.accounts).filter(a=>a.scope===scope&&(scope==='personal'||a.bizId===bizId));

/* ---- scope predicates ---- */
const P={personal:r=>r.scope==='personal',all:()=>true,biz:r=>r.scope==='business'&&(ui.biz==='all'||r.bizId===ui.biz)};
const bizP=()=>r=>r.scope==='business'&&(ui.scope!=='business'||ui.biz==='all'||r.bizId===ui.biz);
const cur=()=>ui.scope==='personal'?P.personal:ui.scope==='business'?P.biz:P.all;
const txsFor=p=>live(db.tx).filter(t=>t.type==='transfer'?(p(acc(t.accountId)||{})||p(acc(t.toAccountId)||{})):p(t));

/* ---- calculations ---- */
function accBalance(a){
  let b=a.opening||0;
  for(const t of live(db.tx)){
    if(t.type==='income'&&t.accountId===a.id)b+=t.amount;
    else if(t.type==='expense'&&t.accountId===a.id)b-=t.amount;
    else if(t.type==='transfer'){if(t.accountId===a.id)b-=t.amount;if(t.toAccountId===a.id)b+=t.amount}
  }
  const U={};live(db.udhaar).forEach(u=>U[u.id]=u);
  for(const u of Object.values(U)){if(u.accountId===a.id)b+=u.dir==='given'?-u.amount:u.amount}
  for(const p of live(db.payments)){const u=U[p.udhaarId];if(u&&p.accountId===a.id)b+=u.dir==='given'?p.amount:-p.amount}
  return r2(b);
}
function accFlow(a){ // cash inflow / outflow for account
  let i=0,o=0;
  for(const t of live(db.tx)){
    if(t.type==='income'&&t.accountId===a.id)i+=t.amount;
    else if(t.type==='expense'&&t.accountId===a.id)o+=t.amount;
    else if(t.type==='transfer'){if(t.accountId===a.id)o+=t.amount;if(t.toAccountId===a.id)i+=t.amount}
  }
  return {i:r2(i),o:r2(o)};
}
const paid=u=>r2(live(db.payments).filter(p=>p.udhaarId===u.id).reduce((s,p)=>s+p.amount,0));
const remaining=u=>Math.max(0,r2(u.amount-paid(u)));
const ustat=u=>{const r=remaining(u);return r<=0.004?'Paid':paid(u)>0?'Partial':'Pending'};
const isOver=u=>remaining(u)>0.004&&u.due&&u.due<today();
function stats(p,from,to){
  let inc=0,exp=0,nonIn=0,nonOut=0;const cats={};const list=[];
  for(const t of live(db.tx)){
    if(t.type==='transfer'||!p(t))continue;
    if(from&&t.date<from)continue;if(to&&t.date>to)continue;
    list.push(t);
    if(t.kind==='nonop'){if(t.type==='income')nonIn+=t.amount;else nonOut+=t.amount;continue}
    if(t.type==='income')inc+=t.amount;else{exp+=t.amount;cats[t.category]=r2((cats[t.category]||0)+t.amount)}
  }
  return {inc:r2(inc),exp:r2(exp),net:r2(inc-exp),nonIn:r2(nonIn),nonOut:r2(nonOut),cats,list};
}
function udStats(p){
  let given=0,back=0,borrowed=0,repaid=0;
  for(const u of live(db.udhaar).filter(p)){const pd_=paid(u);if(u.dir==='given'){given+=u.amount;back+=pd_}else{borrowed+=u.amount;repaid+=pd_}}
  return {given:r2(given),back:r2(back),borrowed:r2(borrowed),repaid:r2(repaid),recv:r2(given-back),pay:r2(borrowed-repaid)};
}
function contactStats(cid){
  const s={given:0,back:0,borrowed:0,repaid:0};
  for(const u of live(db.udhaar).filter(x=>x.contactId===cid)){const p=paid(u);if(u.dir==='given'){s.given+=u.amount;s.back+=p}else{s.borrowed+=u.amount;s.repaid+=p}}
  s.recv=r2(s.given-s.back);s.pay=r2(s.borrowed-s.repaid);s.net=r2(s.recv-s.pay);return s;
}
function range(kind,ref){
  const d=pd(ref);let a,b;
  if(kind==='day'){a=b=ref}
  else if(kind==='week'){const dow=(d.getDay()+6)%7;a=addDays(ref,-dow);b=addDays(a,6)}
  else if(kind==='month'){a=ref.slice(0,7)+'-01';b=ref.slice(0,7)+'-'+pad(new Date(d.getFullYear(),d.getMonth()+1,0).getDate())}
  else{a=ref.slice(0,4)+'-01-01';b=ref.slice(0,4)+'-12-31'}
  return [a,b];
}
function prevRef(kind,ref){
  if(kind==='day')return addDays(ref,-1);
  if(kind==='week')return addDays(ref,-7);
  if(kind==='month')return addDays(ref.slice(0,7)+'-01',-1);
  return (+ref.slice(0,4)-1)+'-06-15';
}
function monthBuckets(n){
  const o=[];const t=pd(today());
  for(let i=n-1;i>=0;i--){const d=new Date(t.getFullYear(),t.getMonth()-i,1);const ym=d.getFullYear()+'-'+pad(d.getMonth()+1);o.push([MON[d.getMonth()],ym+'-01',ym+'-31'])}
  return o;
}
function reportBuckets(kind,ref){
  const [a,b]=range(kind,ref);const o=[];
  if(kind==='year'){for(let m=0;m<12;m++){const ym=a.slice(0,4)+'-'+pad(m+1);o.push([MON[m],ym+'-01',ym+'-31'])}}
  else if(kind==='month'||kind==='week'){let d=a;while(d<=b){const dt=pd(d);o.push([kind==='week'?['Mon','Tue','Wed','Thu','Fri','Sat','Sun'][(dt.getDay()+6)%7]:((dt.getDate()-1)%5===0?String(dt.getDate()):''),d,d]);d=addDays(d,1)}}
  return o;
}
function barChart(buckets,p){
  const data=buckets.map(([l,a,b])=>{const s=stats(p,a,b);return {l,i:s.inc,e:s.exp}});
  const max=Math.max(1,...data.flatMap(d=>[d.i,d.e]));
  const W=320,H=140,step=W/data.length,bw=Math.max(2,Math.min(14,step/2.6));
  let g='';
  data.forEach((d,i)=>{
    const x=i*step+step/2,hi=d.i/max*100,he=d.e/max*100;
    g+=`<rect class="bi" x="${(x-bw-0.5).toFixed(1)}" y="${(112-hi).toFixed(1)}" width="${bw.toFixed(1)}" height="${hi.toFixed(1)}" rx="2"/><rect class="be" x="${(x+0.5).toFixed(1)}" y="${(112-he).toFixed(1)}" width="${bw.toFixed(1)}" height="${he.toFixed(1)}" rx="2"/><text x="${x.toFixed(1)}" y="128">${esc(d.l)}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income vs expense">${g}</svg><div class="legend"><span><i style="background:var(--inc)"></i>Income</span><span><i style="background:var(--exp)"></i>Expense</span></div>`;
}
function catBars(cats){
  const e=Object.entries(cats).sort((a,b)=>b[1]-a[1]);if(!e.length)return empty('Is period me koi kharcha nahi','🧾');
  const max=e[0][1];
  return e.map(([n,v])=>`<div class="bars"><div class="n">${esc(n)}</div><div class="t"><i style="width:${(v/max*100).toFixed(0)}%"></i></div><div class="v">${inr(v)}</div></div>`).join('');
}
function upcomingAll(){
  const o=[];

let MOD=null,busy=false;
function openModal(title,body,onSubmit,o={}){
  MOD={onSubmit,reopen:o.reopen||null,del:o.del||null};
  $('#modal').innerHTML=`<div class="sheet"><div class="sh-h"><b>${title}</b><button type="button" data-a="closem">✕</button></div><form id="mform" autocomplete="off">${body}${o.noSubmit?'':`<div class="btns"><button class="btn pri" type="submit">${o.label||'Save'}</button>${o.del?'<button type="button" class="btn dng" data-a="mdel">Delete</button>':''}</div>`}</form></div>`;
  $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open');$('#modal').innerHTML='';MOD=null}
const field=(l,n,t,v,x)=>`<label>${l}<input name="${n}" type="${t||'text'}" value="${esc(v==null?'':v)}" ${x||''}></label>`;
const sel=(l,n,opts,v,x)=>`<label>${l}<select name="${n}" ${x||''}>${opts.map(o=>{const [a,b]=Array.isArray(o)?o:[o,o];return `<option value="${esc(a)}" ${a==v?'selected':''}>${esc(b)}</option>`}).join('')}</select></label>`;
const area=(l,n,v)=>`<label>${l}<textarea name="${n}" rows="2">${esc(v||'')}</textarea></label>`;
function shrink(file){
  return new Promise((res,rej)=>{
    const r=new FileReader();r.onerror=()=>rej();
    r.onload=()=>{const im=new Image();im.onerror=()=>rej();im.onload=()=>{
      const m=700,k=Math.min(1,m/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
      c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.6))};im.src=r.result};
    r.readAsDataURL(file);
  });
}

function txRow(t){
  const isT=t.type==='transfer';
  const cls=t.type==='income'?'inc':t.type==='expense'?'exp':'mut';
  const sign=t.type==='income'?'+':t.type==='expense'?'−':'⇄';
  const icon=t.type==='income'?'↓':t.type==='expense'?'↑':'⇄';
  const title=isT?`${esc(accName(t.accountId))} → ${esc(accName(t.toAccountId))}`:esc(t.category||'—');
  const meta=[dfmt(t.date),isT?'Transfer':esc(accName(t.accountId)),t.scope==='business'&&!isT?'🏢 '+esc(bizName(t.bizId)):'',t.note?esc(t.note):'',t.kind==='nonop'?'<i>P&L me nahi</i>':''].filter(Boolean).join(' · ');
  return `<div class="row" data-a="edittx" data-id="${t.id}"><div class="ic ${cls}">${icon}</div><div class="grow"><b>${title}</b><small>${meta}</small></div><b class="${cls}">${sign}${inr(t.amount)}</b></div>`;
}

function contactFor(name,phone,kind,scope,bizId){
  const n=name.trim().toLowerCase();
  let c=live(db.contacts).find(x=>x.name.toLowerCase()===n&&x.scope===scope&&(scope==='personal'||x.bizId===bizId));
  if(!c){c=rec({name:name.trim(),phone:phone||'',kind:kind||'personal',scope,bizId:scope==='business'?bizId:null,notes:''});db.contacts.push(c)}
  else{if(phone)c.phone=phone;if(kind)c.kind=kind;c.updated=now()}
  return c;
}

function exportCsv(){
  const p=cur(),R=repText(),s=stats(p,R.a,R.b);
  const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
  const rows=[['Date','Type','Category','Account','Amount','Method','Note','Scope','Business','Counted in P&L']];
  txsFor(p).filter(t=>t.date>=R.a&&t.date<=R.b).sort((a,b)=>a.date.localeCompare(b.date)).forEach(t=>rows.push([t.date,t.type,t.category,t.type==='transfer'?accName(t.accountId)+' -> '+accName(t.toAccountId):accName(t.accountId),t.amount,t.method||'',t.note||'',t.scope,bizName(t.bizId),t.type==='transfer'||t.kind==='nonop'?'No':'Yes']));
  rows.push([],['SUMMARY',R.label],['Income',s.inc],['Expenses',s.exp],['Net',s.net],[],['OUTSTANDING']);
  live(db.udhaar).filter(u=>p(u)&&remaining(u)>0.004).forEach(u=>rows.push([u.dir==='given'?'Receivable':'Payable',cname(u.contactId),remaining(u),u.due||'']));
  download('hisabbook-report-'+R.a+'.csv','\ufeff'+rows.map(r=>r.map(q).join(',')).join('\n'),'text/csv');
}

async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('hb|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch(e){let h=5381;for(const c of 'hb|'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'f'+h}
}

  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.tagName==='A')return;
  const f=A[el.dataset.a];if(f){e.preventDefault();f(el.dataset,el)}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='mform')return;e.preventDefault();
  if(busy||!MOD||!MOD.onSubmit)return;busy=true;
  try{const fd=new FormData(e.target);const d=Object.fromEntries(fd.entries());const r=await MOD.onSubmit(d,fd);if(r!==false)closeModal()}
  catch(err){console.error(err);toast('Error: '+(err&&err.message||err))}
  setTimeout(()=>busy=false,400);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.hasAttribute&&t.hasAttribute('data-re')&&MOD&&MOD.reopen){const d=Object.fromEntries(new FormData($('#mform')).entries());MOD.reopen(d);return}
  if(t.hasAttribute&&t.hasAttribute('data-rep')){ui.sub[t.name==='rp'?'rp':'rd']=t.value||today();render();return}
  if(t.id==='tm'){ui.sub.tm=t.value;$('#txlist').innerHTML=txListHtml()}
  if(t.id==='rf'){
    const f=t.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>{try{const x=JSON.parse(r.result);if(!x||!Array.isArray(x.accounts)||!Array.isArray(x.tx))throw 0;
      if(!confirm('Restore karne se abhi ka data replace ho jayega. Aage badhein?'))return;db=x;load();save();render();toast('Restore ho gaya ✅')}catch(err){toast('File sahi backup nahi hai')}};
    r.readAsText(f);t.value='';
  }
});
document.addEventListener('input',e=>{
  const id=e.target.id;
  if(id==='tq'){ui.sub.tq=e.target.value;$('#txlist').innerHTML=txListHtml()}
  else if(id==='sq'){ui.sub.sq=e.target.value;$('#sres').innerHTML=searchHtml()}
  else if(id==='lq'){ui.sub.lq=e.target.value;$('#lres').innerHTML=ledgerListHtml()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&MOD)closeModal()});
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ===================== Theme, lock, notifications ===================== */
function applyTheme(){
  const t=ls.get('hb_theme')||'auto';
  const dark=t==='dark'||(t==='auto'&&window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme=dark?'dark':'light';
}
let lockedAt=0;
function showLock(){
  if(!ls.get(KEYS.pin))return;
  $('#lock').innerHTML=`<div class="lk"><div style="font-size:44px">📒</div><h2>HisabBook</h2><p class="small" style="color:#b8c6ea">PIN daalo</p><form id="lf"><input id="lpin" type="password" inputmode="numeric" maxlength="6" autocomplete="off"><div id="lerr" class="small" style="color:#fca5a5;min-height:20px;margin-top:8px"></div><button class="btn" style="width:100%;margin-top:6px" type="submit">Unlock</button></form><button class="chip" style="margin-top:18px;background:none;color:#93a0bb;border-color:#344" data-a="lockwipe">PIN bhool gaye?</button></div>`;
  $('#lock').classList.add('on');
  $('#lf').addEventListener('submit',async e=>{e.preventDefault();const v=$('#lpin').value;if(await sha(v)===ls.get(KEYS.pin)){$('#lock').classList.remove('on');$('#lock').innerHTML=''}else{$('#lerr').textContent='Galat PIN';$('#lpin').value=''}});
  setTimeout(()=>{const i=$('#lpin');i&&i.focus()},50);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){lockedAt=Date.now()}
  else if(lockedAt&&Date.now()-lockedAt>60000){showLock()}
});
function checkNotifs(){
  if(demo||typeof Notification==='undefined'||Notification.permission!=='granted')return;
  const t=today();
  upcomingAll().filter(x=>x.date<=t).forEach(x=>{
    const k='hb_n_'+x.key+'_'+t;if(ls.get(k))return;ls.set(k,'1');
    const title='HisabBook: '+x.title,body=(x.date<t?'Overdue · ':'Aaj · ')+(x.amount?inr(x.amount):'');
    try{
      if(navigator.serviceWorker&&navigator.serviceWorker.ready)navigator.serviceWorker.ready.then(r=>r.showNotification(title,{body,icon:'icon-192.png'})).catch(()=>new Notification(title,{body}));
      else new Notification(title,{body});
    }catch(e){}
  });
}

/* ===================== Boot ===================== */
load();applyTheme();autoBackup();render();showLock();
setTimeout(checkNotifs,1500);setInterval(checkNotifs,60000);
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
